### GRAIL - GraphRAG configuration
### Docs: https://microsoft.github.io/graphrag/config/yaml/

### Currently on the Gemini free tier (key from aistudio.google.com/apikey).
### To go back to OpenAI: restore the commented `openai` lines below, set vector_size to 1536,
### raise concurrent_requests, drop the rate_limit blocks, and delete output/ and cache/ before re-indexing.

completion_models:
  default_completion_model:
    model_provider: gemini          # OpenAI: openai
    # Any chat model your key can reach that supports JSON-schema structured output.
    model: gemini-3.5-flash-lite    # OpenAI: gpt-4o-mini
    auth_method: api_key
    api_key: ${GRAPHRAG_API_KEY}
    retry: &retry
      type: exponential_backoff
      max_retries: 10
      max_delay: 90
      # GraphRAG's default list minus ServiceUnavailableError and APIConnectionError: Gemini answers 503 "high demand"
      # when busy, and a brief network drop should not kill an hour-long run - both are worth waiting out.
      exceptions_to_skip:
        - BadRequestError
        - UnsupportedParamsError
        - ContextWindowExceededError
        - ContentPolicyViolationError
        - ImageFetchError
        - InvalidRequestError
        - AuthenticationError
        - PermissionDeniedError
        - NotFoundError
        - UnprocessableEntityError
        - APIError
        - APIResponseValidationError
        - BudgetExceededError
    # Free tier allows only a handful of requests per minute - stay under it instead of eating 429s.
    rate_limit:
      type: sliding_window
      period_in_seconds: 60
      requests_per_period: 10
    metrics:
      # Writes one JSONL record per model call into metrics/ - eval/benchmark.py
      # reads these for real token and cost numbers instead of estimating.
      type: default
      store: memory
      writer: file
      base_dir: "metrics"

embedding_models:
  default_embedding_model:
    model_provider: gemini          # OpenAI: openai
    # 3072 dimensions (OpenAI text-embedding-3-small is 1536).
    # vector_store.vector_size below MUST match or LanceDB rejects the writes.
    model: gemini-embedding-001     # OpenAI: text-embedding-3-small
    auth_method: api_key
    api_key: ${GRAPHRAG_API_KEY}
    retry: *retry
    rate_limit:
      type: sliding_window
      period_in_seconds: 60
      requests_per_period: 60
    metrics:
      type: default
      store: memory
      writer: file
      base_dir: "metrics"

### Concurrency ###
# Lower this if you start seeing 429s during indexing.
concurrent_requests: 2             # OpenAI: 8

### Document processing ###

input:
  type: text

chunking:
  type: tokens
  # Smaller chunks extract more entities but cost proportionally more LLM calls.
  size: 1200
  overlap: 100
  encoding_model: o200k_base

### Storage ###

input_storage:
  type: file
  base_dir: "input"

output_storage:
  type: file
  base_dir: "output"

reporting:
  type: file
  base_dir: "logs"

cache:
  # Keep this on. A failed indexing run resumes from cache instead of re-paying for every call.
  type: json
  storage:
    type: file
    base_dir: "cache"

vector_store:
  type: lancedb
  db_uri: output/lancedb
  vector_size: 3072                # OpenAI text-embedding-3-small: 1536

### Workflow settings ###

embed_text:
  embedding_model_id: default_embedding_model

extract_graph:
  completion_model_id: default_completion_model
  prompt: "prompts/extract_graph.txt"
  # Domain-specific types. This is the main knob that decides what the graph is "about".
  entity_types:
    - mission
    - spacecraft
    - launch_vehicle
    - instrument
    - organization
    - person
    - location
    - celestial_body
    - event
  max_gleanings: 1

summarize_descriptions:
  completion_model_id: default_completion_model
  prompt: "prompts/summarize_descriptions.txt"
  max_length: 500

extract_graph_nlp:
  text_analyzer:
    extractor_type: regex_english

cluster_graph:
  max_cluster_size: 10

extract_claims:
  enabled: false
  completion_model_id: default_completion_model
  prompt: "prompts/extract_claims.txt"
  description: "Any claims or facts that could be relevant to information discovery."
  max_gleanings: 1

community_reports:
  completion_model_id: default_completion_model
  graph_prompt: "prompts/community_report_graph.txt"
  text_prompt: "prompts/community_report_text.txt"
  max_length: 2000
  max_input_length: 8000

snapshots:
  graphml: false
  embeddings: false

### Query settings ###

local_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/local_search_system_prompt.txt"

global_search:
  completion_model_id: default_completion_model
  map_prompt: "prompts/global_search_map_system_prompt.txt"
  reduce_prompt: "prompts/global_search_reduce_system_prompt.txt"
  knowledge_prompt: "prompts/global_search_knowledge_system_prompt.txt"

drift_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/drift_search_system_prompt.txt"
  reduce_prompt: "prompts/drift_reduce_prompt.txt"

basic_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/basic_search_system_prompt.txt"
